# Windows support: build, test and package Winduo on a real Windows machine.
# Runs on every push and pull request; the installer is attached to the run
# as a downloadable artifact (Actions tab > the run > Artifacts).
#
# Releases: a push to main whose package.json version has no GitHub Release
# yet publishes one (tag v<version>, created by electron-builder) with the
# installer and latest.yml, which installed copies of Winduo check for
# updates. So releasing = bump the version, merge to main.
name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets a tag build publish its GitHub Release

jobs:
  windows:
    # windows-2022, not windows-latest: the latest image ships Visual Studio
    # 2026, which the node-gyp bundled with @electron/rebuild doesn't
    # recognize yet, so node-pty fails to compile there.
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci runs the postinstall (electron-rebuild), which compiles
      # node-pty against Electron with the runner's Visual Studio tools.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Blocking: the full suite must pass on Windows.
      - name: Tests
        run: npx vitest run

      - name: Is this a new release?
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Windows installer
        if: ${{ steps.release.outputs.publish != 'true' }}
        run: npm run dist:win

      - name: Build and publish the release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dist.sh --win --x64 --publish always

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: winduo-windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
